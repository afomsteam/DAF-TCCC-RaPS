name: Build TCCC Test APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Validate source content
        run: npm run validate

      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          python3 scripts/apply_android_version.py
          node scripts/harden-android.mjs

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Normalize artifact name and checksum
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TCCC-v2.19.3-test.apk
          sha256sum TCCC-v2.19.3-test.apk > TCCC-v2.19.3-test.apk.sha256
          test -s TCCC-v2.19.3-test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: TCCC-v2.19.3-test
          path: |
            TCCC-v2.19.3-test.apk
            TCCC-v2.19.3-test.apk.sha256
          if-no-files-found: error
          retention-days: 14
