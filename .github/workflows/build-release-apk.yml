name: Build TCCC Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Validate source content
        run: npm run validate

      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          python3 scripts/apply_android_version.py
          node scripts/harden-android.mjs

      - name: Build unsigned release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleRelease

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.TCCC_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "TCCC_KEYSTORE_BASE64 is required" && exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > release-keystore.jks

      - name: Align, sign, and verify release APK
        env:
          KEY_ALIAS: ${{ secrets.TCCC_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.TCCC_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.TCCC_KEY_PASSWORD }}
        run: |
          test -n "$KEY_ALIAS" && test -n "$STORE_PASS" && test -n "$KEY_PASS"
          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="TCCC-v2.19.3-aligned.apk"
          SIGNED="TCCC-v2.19.3-release.apk"
          "$ANDROID_HOME/build-tools/$BT/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks release-keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$SIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose "$SIGNED"
          sha256sum "$SIGNED" > "$SIGNED.sha256"
          rm -f "$ALIGNED" release-keystore.jks

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: TCCC-v2.19.3-release
          path: |
            TCCC-v2.19.3-release.apk
            TCCC-v2.19.3-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
